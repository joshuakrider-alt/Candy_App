name: unpack-backend-remaining
on:
  workflow_dispatch:
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/connect-and-storefront-identity
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack remaining backend parts
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, zlib
          from pathlib import Path
          staging = Path('.agent-staging')
          n = 6
          b64 = ''.join((staging / f'rem.{i}.b64').read_text().strip() for i in range(n))
          blob = zlib.decompress(base64.b64decode(b64.encode()))
          pos = 0
          while pos < len(blob):
            nlen = int.from_bytes(blob[pos:pos+2], 'big'); pos += 2
            name = blob[pos:pos+nlen].decode(); pos += nlen
            dlen = int.from_bytes(blob[pos:pos+4], 'big'); pos += 4
            data = blob[pos:pos+dlen]; pos += dlen
            (staging / name).write_bytes(data)
            print('wrote', name, len(data))
          PY
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "joshuakrider-alt"
          git config user.email "joshua.krider@students.maestrocollege.edu"
          git add .agent-staging
          git commit -m "staging: unpack remaining backend_app.py parts" || echo nochange
          git push origin HEAD:claude/connect-and-storefront-identity
